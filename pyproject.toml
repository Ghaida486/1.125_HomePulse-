[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "homepulse"
version = "0.1.0"
description = "State electricity forecasting with survey-based home scenarios"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "streamlit>=1.40,<2", "plotly>=5.24,<8", "openpyxl>=3.1,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
homepulse = "homepulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
homepulse = ["states.json", "dashboard.css"]
